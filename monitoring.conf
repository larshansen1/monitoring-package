# Server Monitoring Configuration
# Customize these settings before running install.sh

# Notification settings
# The ntfy.sh topic for receiving alerts
# Each server should have a unique topic
NTFY_TOPIC="server-alerts-$(hostname)"

# Disk Space Monitor Settings
DISK_THRESHOLD=80  # Alert when disk usage exceeds this percentage

# Certificate Expiry Settings
CERT_WARNING_DAYS=14   # Warning alert when cert expires in less than this many days
CERT_CRITICAL_DAYS=7   # Critical alert when cert expires in less than this many days

# Security Updates Settings
SECURITY_CRITICAL_THRESHOLD=5   # Alert if this many security updates available
SECURITY_WARNING_THRESHOLD=10   # Alert if this many total updates available
